name: ARKEMX CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: arkemx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Local UI regression suite
        run: npm run test:local:ui

      - name: Typecheck
        run: npm run typecheck
