name: ARKEMX CI

on:
  pull_request:
    branches: [main, fix/prototip-final-2026-10-06]
  push:
    branches: [main, fix/arkemx-adim-adim-2026-10-09]

concurrency:
  group: arkemx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository lint (no errors or warnings)
        run: node node_modules/eslint/bin/eslint.js . --max-warnings 0

      - name: Local UI regression suite
        run: npm run test:local:ui

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

  g05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - name: G05 integrity regression
        run: npm run test:g05
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned independent structural reference
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas3 liblapack3 libgfortran5
          python -m pip install -r tests/frame-reference-requirements.txt
      - name: Compare frame solver with independent OpenSees
        run: node --experimental-strip-types tests/frame-reference.mjs
      - name: Compare shell solver with independent OpenSees and analytic plate
        run: node --experimental-strip-types tests/shell-reference.mjs
      - run: npx playwright install --with-deps chromium
      - name: G05 and UI contract browser regression with repository fixtures
        run: npm run test:g05:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g05-browser-evidence
          path: test-artifacts/g05/
